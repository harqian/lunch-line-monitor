<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nuevasocratica.com/lunch-line-monitor</title>
<meta name="theme-color" content="#0047ff">
<style>
  :root {
    --field: #0047ff;            /* nueva socratica blue, same as the home page */
    --field-offline: #3b4566;    /* the whole page goes slate when the camera is gone */
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.78);
    --ink-faint: rgba(255, 255, 255, 0.5);
    --frame-line: rgba(255, 255, 255, 0.32);
    --frame-floor: rgba(255, 255, 255, 0.06);
    --figure: rgba(255, 255, 255, 0.92);
    --unit: 8px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--field);
    color: var(--ink);
    font-family: var(--sans);
    transition: background-color 600ms ease-out;
  }
  body.offline { background: var(--field-offline); }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(var(--unit) * 3) calc(var(--unit) * 2) calc(var(--unit) * 6);
    display: flex;
    flex-direction: column;
    gap: calc(var(--unit) * 3);
  }
  .masthead { font-size: 13px; letter-spacing: 0.08em; color: var(--ink-faint); }
  .masthead a { color: inherit; text-decoration: none; }
  .board { display: flex; align-items: baseline; gap: calc(var(--unit) * 2); flex-wrap: wrap; }
  .count {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: clamp(96px, 30vw, 200px);
    line-height: 0.85;
    letter-spacing: -0.04em;
  }
  .count-label { font-size: 20px; color: var(--ink-soft); }
  .status { display: flex; align-items: center; gap: var(--unit); font-family: var(--mono); font-size: 14px; color: var(--ink-soft); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: 0.35; }
  body.live .pulse { animation: beat 1.6s ease-out infinite; opacity: 1; }
  @keyframes beat { 0% { opacity: 1; } 70% { opacity: 0.25; } 100% { opacity: 1; } }
  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 1px solid var(--frame-line);
    border-radius: 6px;
    background: var(--frame-floor);
    overflow: hidden;
  }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .box { position: absolute; border: 2px solid #3cff7a; border-radius: 3px; transition: left 150ms linear, top 150ms linear, width 150ms linear, height 150ms linear; }
  .box span { position: absolute; left: -2px; top: -20px; background: #3cff7a; color: #002a10; font: 600 11px var(--mono); padding: 2px 4px; border-radius: 3px 3px 0 0; }
  body.offline .frame img, body.offline .box { opacity: 0.35; }
  body.offline .count, body.offline .count-label { opacity: 0.35; }  /* a stale count must not read as current */
  .frame-empty { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 14px; color: var(--ink-faint); }
  .footnote { font-size: 13px; line-height: 1.5; color: var(--ink-faint); max-width: 52ch; }
  .feedback { display: flex; flex-direction: column; gap: var(--unit); }
  .feedback-title { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
  .feedback textarea { width: 100%; min-height: 72px; resize: vertical; background: var(--frame-floor); color: var(--ink); border: 1px solid var(--frame-line); border-radius: 6px; padding: var(--unit); font: 14px var(--sans); }
  .feedback textarea::placeholder { color: var(--ink-faint); }
  .feedback-row { display: flex; align-items: center; gap: calc(var(--unit) * 1.5); }
  .feedback button { background: var(--ink); color: var(--field); border: 0; border-radius: 6px; padding: 6px 14px; font: 600 13px var(--mono); cursor: pointer; }
  .feedback button:disabled { opacity: 0.5; cursor: default; }
  .feedback-status { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
  .trend { display: flex; flex-direction: column; gap: var(--unit); }
  .trend-title { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
  .trend svg { width: 100%; height: auto; display: block; overflow: visible; }
  .trend .grid { stroke: var(--frame-line); stroke-width: 1; }
  .trend .tick { fill: var(--ink-faint); font: 11px var(--mono); }
  .trend .raw { fill: rgba(255, 255, 255, 0.28); }
  .trend .smoothed { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .trend .empty { fill: var(--ink-faint); font: 13px var(--mono); }
</style>
</head>
<body>
<main>
  <div class="masthead"><a href="/">nuevasocratica.com</a>/lunch-line-monitor</div>
  <div class="board">
    <div class="count" id="count">–</div>
    <div class="count-label" id="count-label">people in view</div>
  </div>
  <div class="status"><span class="pulse"></span><span id="status-text">connecting…</span></div>
  <div class="trend">
    <div class="trend-title">last 90 min · dots = each reading, line = 2 min average</div>
    <svg id="trend" viewBox="0 0 720 200" role="img" aria-label="people in view over the last 90 minutes"></svg>
  </div>
  <div class="frame" id="frame"><img id="frame-image" alt=""><div class="frame-empty" id="frame-empty">waiting for the camera</div></div>
  <form class="feedback" id="feedback-form">
    <label class="feedback-title" for="feedback-message">feedback? ideas, bugs, wrong counts (anonymous)</label>
    <textarea id="feedback-message" maxlength="2000" placeholder="tell the socratica club what you think"></textarea>
    <div class="feedback-row"><button type="submit" id="feedback-send">send</button><span class="feedback-status" id="feedback-status"></span></div>
  </form>
  <p class="footnote">a camera by the lunch line counts people on a raspberry pi. <a href="/lunch-line-monitor/history?hours=168" style="color: inherit">download the count history (csv, last 7 days)</a></p>
</main>
<script>
  const STALE_AFTER_MILLISECONDS = 15000;
  const elements = {
    count: document.getElementById("count"),
    countLabel: document.getElementById("count-label"),
    statusText: document.getElementById("status-text"),
    frame: document.getElementById("frame"),
    frameEmpty: document.getElementById("frame-empty"),
    frameImage: document.getElementById("frame-image"),
  };
  let latestUpdate = null;
  let socketOpen = false;
  let reconnectDelay = 1000;

  function describeAge(milliseconds) {
    const seconds = Math.max(0, Math.round(milliseconds / 1000));
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return `${minutes} min ago`;
    return `${Math.round(minutes / 60)} h ago`;
  }

  function renderStatus() {
    document.body.classList.remove("live", "offline");
    if (!socketOpen) { elements.statusText.textContent = "reconnecting…"; return; }
    if (latestUpdate === null) { elements.statusText.textContent = "connected · waiting for the camera"; return; }
    const age = Date.now() - latestUpdate.received_at;
    if (age > STALE_AFTER_MILLISECONDS) {
      document.body.classList.add("offline");
      elements.statusText.textContent = `camera offline · last seen ${describeAge(age)}`;
    } else {
      document.body.classList.add("live");
      elements.statusText.textContent = `live · updated ${describeAge(age)}`;
    }
  }

  function makeBox() {
    const box = document.createElement("div");
    box.className = "box";
    box.append(document.createElement("span"));
    return box;
  }

  function renderUpdate(update) {
    latestUpdate = update;
    elements.count.textContent = update.count;
    elements.countLabel.textContent = update.count === 1 ? "person in view" : "people in view";
    elements.frame.style.aspectRatio = `${update.frame_width} / ${update.frame_height}`;
    if (update.jpeg) {
      elements.frameEmpty.style.display = "none";
      elements.frameImage.style.display = "";
      elements.frameImage.src = `data:image/jpeg;base64,${update.jpeg}`;
    } else {
      elements.frameEmpty.textContent = "image hidden for privacy";
      elements.frameEmpty.style.display = "";
      elements.frameImage.style.display = "none";
    }
    const boxes = [...elements.frame.querySelectorAll(".box")];
    update.people.forEach((person, index) => {
      const box = boxes[index] ?? elements.frame.appendChild(makeBox());
      box.firstChild.textContent = `person ${person.confidence.toFixed(2)}`;
      const [x1, y1, x2, y2] = person.box;
      box.style.left = `${(100 * x1) / update.frame_width}%`;
      box.style.top = `${(100 * y1) / update.frame_height}%`;
      box.style.width = `${(100 * (x2 - x1)) / update.frame_width}%`;
      box.style.height = `${(100 * (y2 - y1)) / update.frame_height}%`;
    });
    boxes.slice(update.people.length).forEach((box) => box.remove());
    addTrendReading(update);
    renderStatus();
  }

  function connect() {
    const socket = new WebSocket(`${location.origin.replace(/^http/, "ws")}/lunch-line-monitor/live`);
    socket.onopen = () => { socketOpen = true; reconnectDelay = 1000; renderStatus(); };
    socket.onmessage = (event) => renderUpdate(JSON.parse(event.data));
    socket.onclose = () => {
      socketOpen = false;
      renderStatus();
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    };
  }

  // trend: count over [now - 90 min, now], raw readings plus a trailing time-window average
  const TREND_WINDOW_MILLISECONDS = 90 * 60 * 1000;
  const SMOOTHING_WINDOW_MILLISECONDS = 2 * 60 * 1000;
  const TREND_SAMPLE_MILLISECONDS = 2000; // matches the worker's history row interval
  const TREND_GAP_MILLISECONDS = 30000; // readings further apart than this = camera was off, so the line breaks
  const trendSvg = document.getElementById("trend");
  let trendReadings = []; // [{time, count}], oldest first

  async function loadTrendHistory() {
    const response = await fetch(`/lunch-line-monitor/history?hours=${TREND_WINDOW_MILLISECONDS / 3600000}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`history request failed: ${response.status}`);
    const lines = (await response.text()).trim().split("\n").slice(1);
    const loaded = lines.filter(Boolean).map((line) => {
      const [, unixMilliseconds, count] = line.split(",");
      return { time: Number(unixMilliseconds), count: Number(count) };
    });
    // keep live readings that arrived while the history request was in flight
    const lastLoadedTime = loaded.length ? loaded[loaded.length - 1].time : 0;
    trendReadings = loaded.concat(trendReadings.filter((reading) => reading.time > lastLoadedTime));
    renderTrend();
  }

  function addTrendReading(update) {
    const last = trendReadings[trendReadings.length - 1];
    if (last && update.received_at - last.time < TREND_SAMPLE_MILLISECONDS) return;
    trendReadings.push({ time: update.received_at, count: update.count });
  }

  function smoothedReadings(readings) {
    // trailing mean over the last SMOOTHING_WINDOW, so the right edge is the current estimate, not a future-peeking one
    const smoothed = [];
    let windowStart = 0;
    let windowSum = 0;
    readings.forEach((reading, index) => {
      windowSum += reading.count;
      while (readings[windowStart].time < reading.time - SMOOTHING_WINDOW_MILLISECONDS) windowSum -= readings[windowStart++].count;
      smoothed.push({ time: reading.time, count: windowSum / (index - windowStart + 1) });
    });
    return smoothed;
  }

  function renderTrend() {
    const now = Date.now();
    const start = now - TREND_WINDOW_MILLISECONDS;
    trendReadings = trendReadings.filter((reading) => reading.time >= start - SMOOTHING_WINDOW_MILLISECONDS);
    const visible = trendReadings.filter((reading) => reading.time >= start);
    const width = 720, height = 200, left = 28, right = 8, top = 8, bottom = 22;
    const highestCount = Math.max(4, ...visible.map((reading) => reading.count));
    const countStep = Math.ceil(highestCount / 4);
    const maximumCount = countStep * Math.ceil(highestCount / countStep);
    const x = (time) => left + ((time - start) / TREND_WINDOW_MILLISECONDS) * (width - left - right);
    const y = (count) => top + (1 - count / maximumCount) * (height - top - bottom);
    const parts = [];
    for (let count = 0; count <= maximumCount; count += countStep) {
      parts.push(`<line class="grid" x1="${left}" x2="${width - right}" y1="${y(count)}" y2="${y(count)}"/>`);
      parts.push(`<text class="tick" x="${left - 6}" y="${y(count) + 4}" text-anchor="end">${count}</text>`);
    }
    const fifteenMinutes = 15 * 60 * 1000;
    for (let tick = Math.ceil(start / fifteenMinutes) * fifteenMinutes; tick <= now; tick += fifteenMinutes) {
      const label = new Date(tick).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/Los_Angeles" }).toLowerCase().replace(" ", "");
      parts.push(`<text class="tick" x="${x(tick)}" y="${height - 4}" text-anchor="middle">${label}</text>`);
    }
    if (visible.length === 0) {
      parts.push(`<text class="empty" x="${(left + width - right) / 2}" y="${height / 2}" text-anchor="middle">no readings in the last 90 min</text>`);
    }
    for (const reading of visible) parts.push(`<circle class="raw" cx="${x(reading.time).toFixed(1)}" cy="${y(reading.count).toFixed(1)}" r="1.6"/>`);
    let path = "";
    let previousTime = null;
    for (const point of smoothedReadings(trendReadings)) {
      if (point.time < start) { previousTime = point.time; continue; }
      const command = path === "" || point.time - previousTime > TREND_GAP_MILLISECONDS ? "M" : "L";
      path += `${command}${x(point.time).toFixed(1)},${y(point.count).toFixed(1)}`;
      previousTime = point.time;
    }
    if (path) parts.push(`<path class="smoothed" d="${path}"/>`);
    trendSvg.innerHTML = parts.join("");
  }

  const feedbackElements = {
    form: document.getElementById("feedback-form"),
    message: document.getElementById("feedback-message"),
    send: document.getElementById("feedback-send"),
    status: document.getElementById("feedback-status"),
  };

  async function sendFeedback(message) {
    feedbackElements.send.disabled = true;
    feedbackElements.status.textContent = "sending…";
    try {
      const response = await fetch("/lunch-line-monitor/feedback", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message }),
      });
      if (!response.ok) throw new Error(await response.text());
      feedbackElements.message.value = "";
      feedbackElements.status.textContent = "thanks, got it";
    } catch (error) {
      feedbackElements.status.textContent = `didn't send: ${error.message}`;
    } finally {
      feedbackElements.send.disabled = false;
    }
  }

  feedbackElements.form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (feedbackElements.message.value.trim()) sendFeedback(feedbackElements.message.value);
  });

  connect();
  setInterval(renderStatus, 1000);
  loadTrendHistory();
  setInterval(renderTrend, 5000);
</script>
</body>
</html>
