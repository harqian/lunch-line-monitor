name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check worker syntax
        run: node --check web/src/index.js
      - name: Deploy worker
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b5767c459ae1102e08c8dd559b76ee15
        run: npx --yes wrangler@4.152.0 deploy --keep-vars
      - name: Check production page
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /dev/null https://nuevasocratica.com/lunch-line-monitor
